<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Surprise!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- The Interactive Gift Box -->
        <div class="gift-box" id="giftBox">
            <div class="lid" id="boxLid"></div>
            <div class="box-body"></div>
            <div class="ribbon-v"></div>
            <div class="ribbon-h"></div>
        </div>

        <!-- The Hidden Birthday Card -->
        <div class="birthday-card" id="birthdayCard">
            <h2>🎂 Happy Birthday! 🎉</h2>
            <p>Wishing you a wonderful day filled with love, laughter, and endless joy. May all your dreams come true!</p>
            <p class="signature">- With Love ❤️</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
          </html>
